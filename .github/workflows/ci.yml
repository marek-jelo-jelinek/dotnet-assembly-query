name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tesearis.DotNetAssemblyQuery.slnx

      - name: Build (Release)
        run: dotnet build Tesearis.DotNetAssemblyQuery.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Tesearis.DotNetAssemblyQuery.slnx -c Release --no-build --verbosity normal
