name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PROPS_VERSION=$(grep -m1 -oE '<Version>[^<]+</Version>' Directory.Build.props | sed -E 's/<Version>(.*)<\/Version>/\1/')
          echo "Tag version:   $TAG_VERSION"
          echo "props version: $PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tesearis.DotNetAssemblyQuery.slnx

      - name: Build (Release)
        run: dotnet build Tesearis.DotNetAssemblyQuery.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Tesearis.DotNetAssemblyQuery.slnx -c Release --no-build --verbosity normal

      - name: Pack (library + daemon + dotnet tool)
        run: |
          dotnet pack src/Tesearis.DotNetAssemblyQuery/Tesearis.DotNetAssemblyQuery.csproj -c Release -o artifacts
          dotnet pack src/Tesearis.DotNetAssemblyQuery.Daemon/Tesearis.DotNetAssemblyQuery.Daemon.csproj -c Release -o artifacts
          dotnet pack src/Tesearis.DotNetAssemblyQuery.Cli/Tesearis.DotNetAssemblyQuery.Cli.csproj -c Release -o artifacts

      - name: Publish binaries
        run: |
          # Native AOT requires the target OS's own toolchain, so it only works here for
          # linux-x64 (this runner's own OS). The other RIDs are published self-contained
          # without AOT instead of producing broken/non-native "AOT" binaries by cross-publishing
          # from ubuntu-latest. To get real AOT binaries for win-x64/osx-x64/osx-arm64, this step
          # would need to run on windows-latest/macos-latest runners for those RIDs.
          for rid in win-x64 osx-x64 osx-arm64 linux-x64; do
            aot_flag=""
            if [ "$rid" = "linux-x64" ]; then
              aot_flag="-p:PublishAot=true"
            fi
            dotnet publish src/Tesearis.DotNetAssemblyQuery.Cli/Tesearis.DotNetAssemblyQuery.Cli.csproj -c Release -r "$rid" \
              $aot_flag --self-contained true -o "artifacts/publish/$rid"
          done

      - name: Package binaries
        run: |
          VERSION="${RELEASE_TAG#v}"
          for rid in win-x64 osx-x64 osx-arm64 linux-x64; do
            STAGE="artifacts/binaries-stage/$rid"
            mkdir -p "$STAGE"
            cp -r artifacts/publish/"$rid"/. "$STAGE/"
            cp LICENSE README.md "$STAGE/"
            (cd "$STAGE" && zip -r "../../Tesearis.DotNetAssemblyQuery-v${VERSION}-${rid}.zip" .)
          done

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > artifacts/RELEASE_NOTES.md
          if [ ! -s artifacts/RELEASE_NOTES.md ]; then
            echo "::error::No changelog entry found for ${RELEASE_TAG} (expected a '## [${VERSION}]' heading in CHANGELOG.md)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/*.zip \
            --title "${RELEASE_TAG}" \
            --notes-file artifacts/RELEASE_NOTES.md \
            --verify-tag

      - name: Upload NuGet package for publish job
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: nuget-package
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
